<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menü Yönetimi</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="header">
  <a class="badge" href="/admin/index.html">← Geri</a>
  <b>Menü Yönetimi</b>
  <a class="badge" href="#" id="logout">Çıkış</a>
</div>

<div class="wrap">

  <div class="card" id="adminBox">
    <div style="font-weight:900;font-size:18px">Yeni Menü Ürünü Ekle</div>
    <input class="input" id="itemName" placeholder="Ürün adı (örn: Çay, Kahve)" style="margin-top:10px">
    
    <select class="input" id="category" style="margin-top:8px">
      <option value="">Kategori Seç</option>
      <option value="İçecek">İçecek</option>
      <option value="Yiyecek">Yiyecek</option>
      <option value="Alkol">Alkol</option>
      <option value="Nargile">Nargile</option>
      <option value="Diğer">Diğer</option>
    </select>

    <input class="input" id="price" type="number" step="0.01" placeholder="Fiyat (TL)" style="margin-top:8px">

    <button class="btn primary" id="createItem" style="margin-top:10px;width:100%">Ürün Ekle</button>
  </div>

  <div id="menuList"></div>

</div>

<script src="/assets/app.js"></script>
<script>
logout.onclick=()=>{
  localStorage.removeItem("PIN");
  location.href="/admin/login.html";
};

async function loadMenu(){
  const r = await apiGet('menu.list');
  if(!r.ok){
    menuList.innerHTML = `<div class="card"><b>Hata:</b> ${esc(r.error||'')}</div>`;
    return;
  }

  if(r.items.length === 0){
    menuList.innerHTML = `<div class="card">Henüz menü ürünü eklenmemiş.</div>`;
    return;
  }

  // Group by category
  const byCategory = {};
  for(const item of r.items){
    const cat = item.category || 'Diğer';
    if(!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(item);
  }

  let html = '';
  for(const [cat, items] of Object.entries(byCategory)){
    html += `
      <div class="card">
        <b>${esc(cat)}</b>
        <div style="height:8px"></div>
        ${items.map(item => `
          <div class="row" style="justify-content:space-between;margin-top:8px;padding:8px;background:#f5f5f5;border-radius:8px">
            <div>
              <b>${esc(item.name)}</b>
              <div class="small">${item.price} TL</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  menuList.innerHTML = html;
}

createItem.onclick = async ()=>{
  const name = itemName.value.trim();
  const cat = category.value;
  const priceVal = parseFloat(price.value);

  if(!name || !cat || !priceVal || priceVal <= 0){
    alert('Lütfen tüm alanları doldurun');
    return;
  }

  const r = await apiPost('menu.create', {
    name: name,
    category: cat,
    price: priceVal
  });

  if(!r.ok){
    alert('Ürün eklenemedi: ' + (r.error||''));
    return;
  }

  alert('Ürün eklendi!');
  itemName.value = '';
  category.value = '';
  price.value = '';
  loadMenu();
};

async function boot(){
  const me = await whoAmI();
  if(!me || me.role !== 'admin'){
    alert('Bu sayfaya erişim yetkiniz yok');
    location.href = '/admin/index.html';
    return;
  }
  await loadMenu();
}

boot();
</script>

</body>
</html>
