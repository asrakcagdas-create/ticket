<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Giriş</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="wrap">
  <div class="card" style="max-width:520px;margin:60px auto">
    <b style="font-size:20px">7’s Lounge – PIN Giriş</b>
    <div class="small" style="margin-top:6px">6 haneli PIN gir</div>

    <input id="pin" class="input" inputmode="numeric" maxlength="6"
           placeholder="Örn: 111111" style="margin-top:12px">

    <button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">Giriş</button>
    <div id="msg" class="small" style="margin-top:10px"></div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
async function login(){
  const p = pin.value.trim();
  if(p.length < 4){ msg.innerText = "PIN hatalı"; return; }

  localStorage.setItem("PIN", p);

  const r = await apiGet("auth.me");
  if(!r.ok){
    localStorage.removeItem("PIN");
    msg.innerText = "PIN yanlış veya yetki yok.";
    return;
  }

  // giriş ok
  location.href = "/admin/index.html";
}
</script>

</body>
</html>
